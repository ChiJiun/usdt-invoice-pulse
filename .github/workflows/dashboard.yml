name: Daily USDT trade and dashboard

on:
  push:
    branches: [main]
  schedule:
    # 01:17 UTC = 09:17 Asia/Taipei. Avoiding minute 00 reduces queue delays.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - dry-run
          - live

concurrency:
  group: daily-usdt-and-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build, update data, and upload Pages artifact
    runs-on: ubuntu-latest
    env:
      ORDER_USDT: ${{ vars.ORDER_USDT || '1' }}
      USDT_RESERVE: ${{ vars.USDT_RESERVE || '0' }}
      MAX_CONVERT_ENABLED: ${{ vars.MAX_CONVERT_ENABLED || 'true' }}
      MAX_CONVERT_TWD_AMOUNT: ${{ vars.MAX_CONVERT_TWD_AMOUNT || '10' }}
      MAX_CONVERT_USDT_AMOUNT: ${{ vars.MAX_CONVERT_USDT_AMOUNT || '1' }}
      LIVE_TRADING: ${{ vars.LIVE_TRADING || 'false' }}
      CONFIRM_LIVE_TRADING: ${{ secrets.CONFIRM_LIVE_TRADING }}
      BITOPRO_ENABLED: ${{ vars.BITOPRO_ENABLED || 'true' }}
      MAX_ENABLED: ${{ vars.MAX_ENABLED || 'true' }}
      BITOPRO_EMAIL: ${{ secrets.BITOPRO_EMAIL }}
      BITOPRO_API_KEY: ${{ secrets.BITOPRO_API_KEY }}
      BITOPRO_API_SECRET: ${{ secrets.BITOPRO_API_SECRET }}
      MAX_API_KEY: ${{ secrets.MAX_API_KEY }}
      MAX_API_SECRET: ${{ secrets.MAX_API_SECRET }}
      GMAIL_INVOICE_ENABLED: ${{ vars.GMAIL_INVOICE_ENABLED || 'false' }}
      GMAIL_BITOPRO_QUERY: ${{ vars.GMAIL_BITOPRO_QUERY }}
      GMAIL_MAX_QUERY: ${{ vars.GMAIL_MAX_QUERY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test trading safeguards
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run selected automation mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python -m bot.runner --refresh
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "validate" ]]; then
            python -m bot.verify
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "live" && "$LIVE_TRADING" != "true" ]]; then
            echo "LIVE_TRADING 尚未開啟，已拒絕真實下單。" >&2
            exit 2
          elif [[ "$LIVE_TRADING" == "true" ]] && { [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ inputs.mode }}" == "live" ]]; }; then
            python -m bot.runner --live
          else
            python -m bot.runner --dry-run
          fi

      - name: Sync invoice emails from Gmail (read-only)
        id: gmail_sync
        if: github.event_name != 'push' && env.GMAIL_INVOICE_ENABLED == 'true'
        continue-on-error: true
        run: python -m bot.gmail_invoices

      - name: Mark Gmail invoice sync as disabled
        if: github.event_name != 'push' && env.GMAIL_INVOICE_ENABLED != 'true'
        run: python -m bot.gmail_invoices --disabled

      - name: Refresh dashboard after Gmail sync
        if: github.event_name != 'push'
        run: python -m bot.runner --refresh

      - name: Save sanitized dashboard data
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- public/data/dashboard.json data/state.json data/invoice-records.json data/invoice-sync-status.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json data/state.json data/invoice-records.json data/invoice-sync-status.json
          git commit -m "chore: update daily trading dashboard"
          git push

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build dashboard
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy dashboard to GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            const pagesArtifacts = artifacts.filter(
              (artifact) => artifact.name === "github-pages" && !artifact.expired,
            );

            if (pagesArtifacts.length !== 1) {
              throw new Error(
                `Expected one github-pages artifact, found ${pagesArtifacts.length}.`,
              );
            }

            const oidcToken = await core.getIDToken();
            const deployment = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                owner,
                repo,
                artifact_id: pagesArtifacts[0].id,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
              },
            );
            const deploymentId =
              deployment.data.id ||
              deployment.data.status_url?.split("/").pop() ||
              context.sha;
            core.setOutput("page_url", deployment.data.page_url || "");
            core.info(`Created Pages deployment ${deploymentId}.`);

            const finalFailures = new Set([
              "deployment_failed",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost",
            ]);
            const deadline = Date.now() + 30 * 60 * 1000;
            let statusErrors = 0;

            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10000));

              try {
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}",
                  { owner, repo, deploymentId },
                );
                const status = response.data.status;
                core.info(`Current Pages status: ${status}`);
                statusErrors = 0;

                if (status === "succeed") {
                  core.setOutput("status", "succeed");
                  return;
                }
                if (finalFailures.has(status)) {
                  throw new Error(`Pages deployment ended with ${status}.`);
                }
              } catch (error) {
                if (finalFailures.has(error.message?.match(/deployment_\w+/)?.[0])) {
                  throw error;
                }
                statusErrors += 1;
                core.warning(`Unable to read Pages status: ${error.message}`);
                if (statusErrors >= 10) throw error;
              }
            }

            throw new Error(
              "Pages deployment remained pending for more than 30 minutes.",
            );
